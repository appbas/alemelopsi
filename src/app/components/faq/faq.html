<section id="faq" class="faq-section section-padding">
  <div class="container">
    <!-- Section Header -->
    <div class="faq-header">
      <span class="section-subtitle">Dúvidas Frequentes</span>
      <h2 class="section-title">Esclareça Suas Principais Dúvidas</h2>
      <p class="faq-header-text">
        Encontre respostas para as perguntas mais comuns sobre o acompanhamento psicanalítico clínico e o funcionamento dos nossos cursos online.
      </p>
    </div>
    
    <!-- Accordion List using modern @for control flow -->
    <div class="faq-accordion">
      @for (item of faqs(); track $index) {
        <div class="faq-item" [class.active]="activeFaqIndex() === $index">
          <button 
            class="faq-trigger" 
            (click)="toggleFaq($index)"
            [attr.aria-expanded]="activeFaqIndex() === $index"
            id="faq-trigger-{{$index}}">
            <span class="faq-question">{{ item.question }}</span>
            <span class="faq-arrow">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </span>
          </button>
          
          <div class="faq-content" [class.expanded]="activeFaqIndex() === $index">
            <div class="faq-content-inner">
              <p>{{ item.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
